<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem solving</title>
</head>
<body>
    <script>
//Хүмүүсийн нэр болон насны мэдээлэл persons object array-д өгөгдсөн. Filter ашиглан гүйцэтгэнэ.

const people = [
{id: 1, name: "DORJ", age: 19},
{id: 2, name: "BOLD", age: 13},
{id: 3, name: "BAT", age: 15},
{id: 4, name: "TURUU", age: 20},
{id: 15, name: "SUMBEE", age: 23}
];

//18 нас хүрсэн хүмүүсийг ялгаж adult array-д хадгал.
 console.log(people);
    const over18 = people.filter((person) => {
      return person.age>18;
    });
    console.log(over18);
//Өгөгдсөн код дээрх даалгавруудыг map ашиглан гүйцэтгэж үр дүнг console-руу хэвлэ.

const users = [
  { id: 11, name: "bat", age: 23, group: "editor" },
  { id: 47, name: "sukhee", age: 28, group: "admin" },
  { id: 75, name: "bymbaa", age: 34, group: "editor" },
  { id: 33, name: "bandia", age: 19, group: "admin" },
  { id: 45, name: "tumee", age: 27, group: "editor" },
];

const capitalizedUsers = users.map(user => {
  return {
    ...user,
//users array object өгөгдсөн бол name-ын эхний үсгийг томруулах.
    name: user.name.charAt(0).toUpperCase() + user.name.slice(1)
  };
});

console.log(capitalizedUsers);
// Өгөгдсөн код дээрх даалгаврыг map, filter, reduce ашиглан гүйцэтгэж үр дүн console руу хэвлэ.
const yasers = [
{ id: 11, name: 'Bat', age: 23, group: 'editor' },
{ id: 47, name: 'Bold', age: 28, group: 'admin' },
{ id: 85, name: 'Tulga', age: 34, group: 'editor' },
{ id: 97, name: 'Suren', age: 28, group: 'admin' }
];
const editors = yasers.filter(user => user.group === 'editor');
console.log("Editors:", editors);
const names = yasers.map(user => user.name);
console.log("Names:", names);
const averageAge = yasers.reduce((sum, user, _, avg) => sum + user.age / avg.length, 0);
console.log("Average age:", averageAge.toFixed(2));


//"admin" хэрэглэгчдийг шүүж ав.
    const onlyAdmin = yasers.filter((yaser) => {
      return yaser.group === "admin";
    });
    console.log("Admins:", onlyAdmin );
//Өөрийн map function-ийг өөрөө хэрэгжүүлэх. Доорх жишээгээр шалгаарай.

myMap(['5', '7', '22'], parseInt)
myMap(['5', '7', '22'], Number)
myMap(['5', '7', '22'], x => Number(x) * 2)

//syntax - myMap(<array>, <дурын үйлдэл>
    function myMap(array, myFunction) {
  const result = [];
  for (let i = 0; i < array.length; i++) {
    result.push(myFunction(array[i], i, array));
  }
  return result;
}

console.log(myMap(['5', '7', '22'], x => parseInt(x)));    
console.log(myMap(['5', '7', '22'], Number));               
console.log(myMap(['5', '7', '22'], x => Number(x) * 2)); 


    </script>
</body>
</html>
