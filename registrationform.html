<!DOCTYPE html>
<html>
<form>
<fieldset>
            <legend><strong>Registeration form</strong></legend>
            <div>
                <label for="fullname">Name:</label>
            <input type="text" name="fullname" placeholder="Surname" required>
            </div>
            <div>
                <label for="fullname">Email:</label>
            <input type="text" name="email" placeholder="example@gmail.com" required>
            </div>
            <div>
                <label for="fullname">Password:</label>
            <input type="text" name="password" placeholder="*************" required>
            </div>
            <div>
                <legend>Gender:</legend>
                <input type="radio" name="Gender">Male
                <input type="radio" name="Gender">Female
                <input type="radio" name="Gender">Rather not say
            </div>
            <div>
                <legend>Hobbies</legend>
                <input type="checkbox" name="sport">Sports
                <input type="checkbox" name="sport">Music
                <input type="checkbox" name="sport">Reading
                <input type="checkbox" name="sport">Other
                <textarea name="notes" rows="1" cols="5">
                </textarea>
            </div>
            <div>
                <label>Country:</label>
                <select id="Country" name="Country">
                <option>USA</option>
                <option>Mongolia</option>
                <option>Russia</option>
                </select>
            </div>
            <div>
                <label>Bio</label>
                <textarea name="notes" rows="3" cols="20">
                </textarea>
            </div>
            <div>
                <legend>Card number</legend>
                <input type="text" name="card" placeholder="xxxx xxxx xxxx" required>
            </div>
                <button type="button">Register</button>   
</fieldset>
</form>
</html>
